[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "megaknob"
version = "0.8.2b1"
description = "Physical volume controller for Windows based on RP2040"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "PySide6==6.11.1",
    "pycaw==20251023",
    "pyserial==3.5",
    "psutil==7.2.2",
    "pywin32==312",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["python_app", "python_app.*"]
namespaces = false